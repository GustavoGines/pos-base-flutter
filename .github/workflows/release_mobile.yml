name: Release Mobile (Android APK)

on:
  push:
    tags:
      - 'mobile-v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#mobile-v}" >> $GITHUB_OUTPUT

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'

      - name: Update pubspec version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.VERSION }}+${{ github.run_number }}/" pubspec.yaml

      - name: Update currentAppVersion in main.dart
        run: |
          sed -i "s/const currentAppVersion = '[^']*'/const currentAppVersion = '${{ steps.version.outputs.VERSION }}'/" lib/main.dart
          echo "✅ currentAppVersion actualizado a ${{ steps.version.outputs.VERSION }}"

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/pos_mobile_release.jks
          else
            echo "ANDROID_KEYSTORE_BASE64 secret is not set. Cannot build release APK."
            exit 1
          fi

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK (release)
        env:
          ANDROID_KEYSTORE_PATH: pos_mobile_release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk pos_mobile_v${{ steps.version.outputs.VERSION }}.apk

      - name: Upload APK to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp pos_mobile_v${{ steps.version.outputs.VERSION }}.apk \
            s3://${{ secrets.R2_BUCKET_NAME }}/mobile/pos_mobile_v${{ steps.version.outputs.VERSION }}.apk \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --content-type application/vnd.android.package-archive \
            --no-progress

          # También sobreescribir "latest" para URL fija del QR
          aws s3 cp pos_mobile_v${{ steps.version.outputs.VERSION }}.apk \
            s3://${{ secrets.R2_BUCKET_NAME }}/mobile/pos_mobile_latest.apk \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --content-type application/vnd.android.package-archive \
            --no-progress

      - name: Notify License Server
        run: |
          VERSION_NO_V=$(echo "${{ steps.version.outputs.VERSION }}" | sed 's/^v//')
          CHANGELOG=""
          
          if [ -f "CHANGELOG_MOBILE.md" ]; then
            # Extraer solo la sección de esta versión
            CHANGELOG=$(awk -v ver="^## \\[$VERSION_NO_V\\]" '
              $0 ~ ver {flag=1; next}
              /^## \[/ {if(flag) exit}
              flag && NF {print $0}
            ' CHANGELOG_MOBILE.md | sed 's/^### //g' | sed 's/\*\*//g')
          fi
          
          if [ -z "$CHANGELOG" ]; then
            # Si no hay entrada en el archivo, usar el último commit de forma limpia
            LAST_COMMIT=$(git log -1 --pretty=%B | head -n 1)
            CHANGELOG="🚀 Nueva actualización disponible.\n\n• $LAST_COMMIT"
          fi

          # Es necesario escapar comillas para el JSON
          CHANGELOG_ESCAPED=$(echo -e "$CHANGELOG" | jq -Rsa .)

          curl -s -X POST ${{ secrets.LICENSE_SERVER_URL }}/api/releases/new \
            -H "Content-Type: application/json" \
            -d "{
              \"version\": \"v${{ steps.version.outputs.VERSION }}\",
              \"component\": \"android\",
              \"channel\": \"beta\",
              \"download_url\": \"${{ secrets.R2_PUBLIC_BASE_URL }}/mobile/pos_mobile_v${{ steps.version.outputs.VERSION }}.apk\",
              \"changelog\": $CHANGELOG_ESCAPED,
              \"is_critical\": false,
              \"token\": \"${{ secrets.LICENSE_SERVER_TOKEN }}\"
            }"

      - name: 🏷️ Publicar GitHub Release con el APK
        uses: softprops/action-gh-release@v2
        with:
          files: pos_mobile_v${{ steps.version.outputs.VERSION }}.apk
          generate_release_notes: true
          name: "Mobile v${{ steps.version.outputs.VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

