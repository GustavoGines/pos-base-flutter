<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=Inter:wght@400;500;600;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1920px;
    height: 1080px;
    background: radial-gradient(ellipse at 50% 30%, #1a2540 0%, #121a2d 50%, #0a0e19 100%);
    font-family: 'Montserrat', sans-serif;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Ambient background glows */
  .glow-cyan {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(46, 213, 162, 0.12) 0%, transparent 70%);
    top: 50px;
    left: 200px;
    filter: blur(80px);
    pointer-events: none;
  }

  .glow-amber {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(245, 166, 35, 0.10) 0%, transparent 70%);
    top: 50px;
    right: 200px;
    filter: blur(80px);
    pointer-events: none;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    z-index: 10;
  }

  /* Logo */
  .logo-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 25px;
  }

  .logo-img {
    height: 330px;
    object-fit: contain;
    filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.5));
  }

  .by-brand {
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 5px;
    color: #7d8ea8;
    text-transform: uppercase;
    margin-top: 5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .by-brand span {
    color: #ffffff;
    font-weight: 700;
    letter-spacing: 2px;
  }

  /* Divider line */
  .divider {
    width: 480px;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, #2ed5a2 40%, #f5a623 60%, transparent 100%);
    margin: 20px 0 35px 0;
    opacity: 0.85;
  }

  /* CTA Headline */
  .cta-headline {
    font-size: 34px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }

  .cta-sub {
    font-size: 20px;
    font-weight: 400;
    color: #a0aec0;
    margin-bottom: 40px;
  }

  /* Contact Cards / Pills */
  .contacts-row {
    display: flex;
    gap: 32px;
    align-items: center;
    justify-content: center;
  }

  .contact-card {
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(16px);
    padding: 18px 36px;
    border-radius: 18px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
  }

  .icon-box {
    width: 58px;
    height: 58px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon-wa {
    background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
    box-shadow: 0 8px 20px rgba(37, 211, 102, 0.35);
  }

  .icon-ig {
    background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    box-shadow: 0 8px 20px rgba(220, 39, 67, 0.35);
  }

  .icon-svg {
    width: 32px;
    height: 32px;
    fill: #ffffff;
  }

  .contact-info {
    text-align: left;
    display: flex;
    flex-direction: column;
  }

  .contact-label {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #7d8ea8;
    margin-bottom: 2px;
  }

  .contact-value {
    font-size: 26px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 0.5px;
  }

  .contact-card.wa-card .contact-value {
    color: #4efaab;
  }

  /* Footer Tagline */
  .footer-tagline {
    margin-top: 45px;
    font-size: 14px;
    font-weight: 500;
    color: #5a6a85;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
</style>
</head>
